groups:
  - name: demo-alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: |
          sum(rate(app_http_requests_total{status=~"5.."}[1m]))
            / sum(rate(app_http_requests_total[1m])) > 0.05
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of requests are failing"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(app_http_request_duration_seconds_bucket[1m])) by (le)) > 0.3
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 300ms"

      - alert: HighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 85
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Host CPU above 85%"
